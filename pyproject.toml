[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agencybill"
version = "0.1.0"
description = "Agentic LPL Agency Bill Renewal Workflow"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1",
    "rich>=13.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
agencybill = "agencybill.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["agencybill*"]
